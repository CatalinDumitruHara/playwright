# Perfil de tests de integración: datasource PROPIO de test, aislado y efímero.
# Orden de resolución (AbstractOracleIT, @DynamicPropertySource, gana sobre esto):
#   1) Oracle del entorno de prueba de la sesión (MIND_ENV_ORACLE_*), si está definido;
#   2) si no, Testcontainers con la imagen real gvenzl/oracle-free:23-slim (clon limpio/CI).
# Nunca hereda el datasource de producción (SPRING_DATASOURCE_*).
spring:
  datasource:
    url: ${MIND_ENV_ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${MIND_ENV_ORACLE_USER:test}
    password: ${MIND_ENV_ORACLE_PASSWORD:test}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    drop-first: true
    change-log: classpath:db/changelog/t5-users-fixture.yaml
