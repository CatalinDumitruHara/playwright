# Fixture de TEST: réplica del esquema T.5 (user_roles, users) que en producción aplica
# el componente de datos. Solo se usa en los tests de integración (perfil "it").
databaseChangeLog:
  - changeSet:
      id: t5-user-roles
      author: mind-tsk-001-test
      changes:
        - createTable:
            tableName: USER_ROLES
            columns:
              - column: { name: ID, type: "NUMBER(19,0)", constraints: { primaryKey: true, nullable: false } }
              - column: { name: ROLE_NAME, type: "VARCHAR2(50)", constraints: { nullable: false, unique: true } }
        - insert: { tableName: USER_ROLES, columns: [ { column: { name: ID, valueNumeric: 1 } }, { column: { name: ROLE_NAME, value: EMPLEADO } } ] }
        - insert: { tableName: USER_ROLES, columns: [ { column: { name: ID, valueNumeric: 2 } }, { column: { name: ROLE_NAME, value: MANAGER } } ] }
        - insert: { tableName: USER_ROLES, columns: [ { column: { name: ID, valueNumeric: 3 } }, { column: { name: ROLE_NAME, value: ADMINISTRADOR } } ] }
  - changeSet:
      id: t5-users
      author: mind-tsk-001-test
      changes:
        - createSequence: { sequenceName: USERS_SEQ, startValue: 1, incrementBy: 1 }
        - createTable:
            tableName: USERS
            columns:
              - column: { name: ID, type: "NUMBER(19,0)", constraints: { primaryKey: true, nullable: false } }
              - column: { name: FULL_NAME, type: "VARCHAR2(255)", constraints: { nullable: false } }
              - column: { name: EMAIL, type: "VARCHAR2(255)", constraints: { nullable: false, unique: true } }
              - column: { name: PASSWORD_HASH, type: "VARCHAR2(255)", constraints: { nullable: false } }
              - column: { name: ROLE_ID, type: "NUMBER(19,0)", constraints: { nullable: false, foreignKeyName: FK_USERS_ROLE, references: "USER_ROLES(ID)" } }
              - column: { name: MANAGER_ID, type: "NUMBER(19,0)", constraints: { nullable: true, foreignKeyName: FK_USERS_MANAGER, references: "USERS(ID)" } }
              - column: { name: IS_ACTIVE, type: "CHAR(1)", constraints: { nullable: false } }
              - column: { name: CREATED_AT, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: UPDATED_AT, type: TIMESTAMP, constraints: { nullable: false } }
        - sql:
            sql: ALTER TABLE USERS ADD CONSTRAINT CK_USERS_IS_ACTIVE CHECK (IS_ACTIVE IN ('Y','N'))
