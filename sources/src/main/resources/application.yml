spring:
  application:
    name: microservice
  datasource:
    url: ${SPRING_DATASOURCE_URL:${MIND_ENV_ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
    username: ${SPRING_DATASOURCE_USERNAME:${MIND_ENV_ORACLE_USER:mind_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MIND_ENV_ORACLE_PASSWORD:}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    # El esquema lo aplica el componente de datos
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/mapfre/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health

documentos:
  comprobante:
    # Gap REQ-027: el RFP no proporciona el nombre de la empresa; parametrizado por entorno
    company-name: ${DOCUMENTOS_COMPANY_NAME:MAPFRE}
    pie-legal: ${DOCUMENTOS_PIE_LEGAL:}
    max-intentos: ${DOCUMENTOS_PDF_MAX_INTENTOS:2}
