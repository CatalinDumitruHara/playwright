<div class="container">
  <h1>Nueva incidencia</h1>
  <form [formGroup]="incidentForm" (ngSubmit)="onSubmit()">
    <b2b-dropdown-select
      label="Sala"
      formControlName="roomId"
      [options]="(rooms$ | async) ?? []"
      optionValue="id"
      optionText="name"
      [required]="true"
    ></b2b-dropdown-select>

    <b2b-dropdown-select
      label="Categoría"
      formControlName="categoryCode"
      [options]="(categories$ | async) ?? []"
      optionValue="code"
      optionText="name"
      [required]="true"
    ></b2b-dropdown-select>

    <b2b-text-area
      label="Descripción"
      formControlName="description"
      [required]="true"
    ></b2b-text-area>

    <b2b-file-uploader
      label="Foto"
      formControlName="photo"
    ></b2b-file-uploader>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="incidentForm.invalid"
    >
      Enviar
    </button>
  </form>
</div>
