<div class="container">
  <h1>Detalle de incidencia</h1>

  <b2b-spinner *ngIf="loading"></b2b-spinner>

  <div *ngIf="incident$ | async as incident">
    <h2>{{ incident.reference }}</h2>
    <div><strong>Sala:</strong> {{ incident.room }}</div>
    <div><strong>Categoría:</strong> {{ incident.category }}</div>
    <div><strong>Estado:</strong> {{ incident.status }}</div>
    <div><strong>Descripción:</strong> {{ incident.description }}</div>
    <div><strong>Fecha:</strong> {{ incident.createdAt | date:'short' }}</div>
  </div>
</div>
