<b2b-notification-inline [visible]="true" type="ok">
  Incidencia registrada correctamente
</b2b-notification-inline>

<b2b-read-data>
  <span b2b-read-data-label>Código de referencia</span>
  <span b2b-read-data-value>{{ incidentId() }}</span>
</b2b-read-data>

<button b2b-button (click)="navigateToIncidentDetail()">
  Ver detalle de la incidencia
</button>
<button b2b-button variant="secondary" (click)="navigateToCreateIncident()">
  Crear otra incidencia
</button>
