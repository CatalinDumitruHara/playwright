<b2b-container>
  <div b2b-container-body class="forced-page">
    <h1 style="font-size: var(--b2b-titles-04-font-size)">
      Cambio obligatorio de contraseña
    </h1>

    <b2b-notification-inline
      class="notification"
      [visible]="true"
      state="alert"
      type="alert"
      title="Debes establecer una contraseña nueva antes de continuar"
      description="Por seguridad, establece tu contraseña definitiva para poder operar en la aplicación."
    ></b2b-notification-inline>

    <form
      class="form"
      [formGroup]="form"
      (ngSubmit)="changePassword()"
      autocomplete="off"
      novalidate
    >
      <b2b-password-field
        class="b2b-width-full"
        formControlName="newPassword"
        label="Contraseña nueva"
        inputName="newPassword"
      ></b2b-password-field>

      <b2b-password-field
        class="b2b-width-full"
        formControlName="confirmPassword"
        label="Confirmación de la contraseña nueva"
        inputName="confirmPassword"
      ></b2b-password-field>

      <b2b-notification-inline
        class="notification"
        [visible]="showMismatch"
        state="error"
        type="error"
        title="Las contraseñas no coinciden"
      ></b2b-notification-inline>

      <b2b-notification-inline
        class="notification"
        [visible]="true"
        state="info"
        type="info"
        title="Requisitos de la contraseña"
        description="Mínimo 10 caracteres, al menos una mayúscula, una minúscula y un número, y no puede contener tu usuario."
      ></b2b-notification-inline>

      <b2b-notification-inline
        *ngIf="errorMessage"
        class="notification"
        data-testid="forced-error"
        [visible]="true"
        state="error"
        type="error"
        [title]="errorMessage"
        [description]="errorDetail ?? ''"
      ></b2b-notification-inline>

      <div class="actions">
        <button
          b2b-button
          type="button"
          class="b2b--secondary"
          variant="secondary"
          data-testid="forced-logout"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
        <button b2b-button type="submit" data-testid="forced-submit">
          Establecer contraseña
        </button>
      </div>
    </form>
  </div>
</b2b-container>
