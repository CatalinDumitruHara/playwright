<div class="b2b-container">
  <h1 style="font-size: var(--b2b-titles-04-font-size)">
    Credencial temporal caducada
  </h1>
  <b2b-notification-inline [visible]="true" type="error">
    <p>Su credencial temporal ha caducado.</p>
    <p>
      Por favor, solicite un nuevo restablecimiento a su Administrador.
    </p>
  </b2b-notification-inline>

  <a b2b-button routerLink="/acceso">Volver al formulario de acceso</a>
</div>
