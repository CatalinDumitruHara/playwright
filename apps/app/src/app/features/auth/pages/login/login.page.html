<div class="container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Acceso</h2>

    <div class="form-field">
      <label for="username">Correo corporativo</label>
      <input b2b-input id="username" formControlName="username" type="email" placeholder="tu.correo@mapfre.com">
      <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
        El correo es obligatorio y debe tener un formato válido.
      </div>
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input b2b-input id="password" formControlName="password" type="password" placeholder="Contraseña">
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
        La contraseña es obligatoria.
      </div>
    </div>

    <div *ngIf="authError" class="error-message">
      Usuario o contraseña incorrectos.
    </div>

    <button b2b-button type="submit" [disabled]="loginForm.invalid">Acceder</button>
  </form>
</div>
