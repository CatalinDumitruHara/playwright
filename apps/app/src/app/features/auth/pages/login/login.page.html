<b2b-container>
  <div class="login-page">
    <h1 style="font-size: var(--b2b-titles-04-font-size)">Acceso</h1>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" data-testid="login-form" novalidate>
      <div class="login-field">
        <label b2b-label for="username">Correo corporativo</label>
        <input b2b-input class="b2b-width-full" formControlName="username" id="username" autocomplete="username" />
      </div>

      <div class="login-field">
        <b2b-password-field
          class="b2b-width-full"
          formControlName="password"
          label="Contraseña"
          inputName="password"
        ></b2b-password-field>
      </div>

      <b2b-notification-inline
        [visible]="!!errorMessage"
        state="error"
        type="error"
        [title]="errorMessage ?? ''"
        data-testid="login-error"
      ></b2b-notification-inline>

      <button b2b-button type="submit" [disabled]="submitting" data-testid="login-submit">Acceder</button>
    </form>
  </div>
</b2b-container>
