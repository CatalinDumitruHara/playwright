<div class="b2b-container">
  <h1 style="font-size: var(--b2b-titles-04-font-size)">Acceso</h1>
  <form [formGroup]="form" (ngSubmit)="login()">
    <div class="form-field">
      <label b2b-label for="username">Correo corporativo</label>
      <input
        b2b-input
        class="b2b-width-full"
        id="username"
        name="username"
        formControlName="username"
      />
    </div>
    <div class="form-field">
      <label b2b-label for="password">Contraseña</label>
      <input
        b2b-input
        class="b2b-width-full"
        id="password"
        name="password"
        type="password"
        formControlName="password"
      />
    </div>
    <button b2b-button type="submit" [disabled]="form.invalid">Acceder</button>
  </form>
</div>
