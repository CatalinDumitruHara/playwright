<b2b-container>
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 style="font-size: var(--b2b-titles-04-font-size)">Sesión Finalizada</h1>
        <b2b-notification-inline [visible]="true" type="info">
          <p data-testid="reason">{{ reason }}</p>
          <p data-testid="datetime">Fecha y hora: {{ endedAt | date: 'dd/MM/yyyy HH:mm:ss' }}</p>
        </b2b-notification-inline>
        <button b2b-button (click)="goToLogin()" data-testid="back-button" class="mt-3">Volver a acceder</button>
      </div>
    </div>
  </div>
</b2b-container>
