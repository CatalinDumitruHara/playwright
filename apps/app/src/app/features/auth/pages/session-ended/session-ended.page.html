<ion-header>
  <ion-toolbar>
    <ion-title>Sesión Finalizada</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Sesión Finalizada</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p data-testid="reason">{{ reason }}</p>
      <p data-testid="datetime">Fecha y hora: {{ endedAt | date: 'dd/MM/yyyy HH:mm:ss' }}</p>
      <ion-button expand="block" (click)="goToLogin()" data-testid="back-button">Volver a acceder</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
