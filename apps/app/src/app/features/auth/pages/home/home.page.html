<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="user-info" *ngIf="user$ | async as user">
    <h2>Bienvenido, {{ user.name || 'Usuario' }}</h2>
    <p>Rol: {{ user.role_code }}</p>
  </div>

  <div class="shortcuts" *ngIf="user$ | async as user">
    <h3>Accesos directos</h3>
    <b2b-sidebar-item title="Opción 1" *ngIf="user.role_code === 'user' || user.role_code === 'admin'">Opción 1</b2b-sidebar-item>
    <b2b-sidebar-item title="Opción 2" *ngIf="user.role_code === 'admin'">Opción 2</b2b-sidebar-item>
  </div>

  <ion-button expand="block" (click)="logout()">Cerrar sesión</ion-button>
</ion-content>
