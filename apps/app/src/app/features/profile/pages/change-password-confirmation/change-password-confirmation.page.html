<b2b-container>
  <b2b-notification-inline [visible]="true" type="ok">
    <p>Contraseña cambiada con éxito</p>
    <p>Fecha y hora: {{ changedAt | date : 'medium' }}</p>
    <p>
      Se han cerrado las demás sesiones que pudieras tener abiertas en otros
      dispositivos.
    </p>
  </b2b-notification-inline>

  <a b2b-button routerLink="/mi-perfil">Volver a Mi perfil</a>
</b2b-container>
