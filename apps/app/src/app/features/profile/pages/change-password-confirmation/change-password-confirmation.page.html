<b2b-container>
  <h1 style="font-size: var(--b2b-titles-04-font-size)">Contraseña actualizada</h1>

  <div class="confirmation-content">
    <b2b-notification-inline
      [visible]="true"
      state="ok"
      type="ok"
      title="Tu contraseña se ha cambiado correctamente"
      data-testid="success-message"
    ></b2b-notification-inline>

    <b2b-read-data>
      <span b2b-read-data-label>Fecha y hora del cambio</span>
      <span b2b-read-data-value data-testid="change-datetime">{{
        changeDateTime | date: 'dd/MM/yyyy HH:mm'
      }}</span>
    </b2b-read-data>

    <b2b-notification-inline
      [visible]="true"
      state="info"
      type="info"
      title="Por tu seguridad, se han cerrado tus demás sesiones abiertas"
      data-testid="sessions-revoked"
    ></b2b-notification-inline>

    <div class="confirmation-actions">
      <button b2b-button type="button" data-testid="back-to-profile" (click)="backToProfile()">
        Volver a Mi perfil
      </button>
    </div>
  </div>
</b2b-container>
