<b2b-container>
  <h1 style="font-size: var(--b2b-titles-04-font-size)">Cambiar contraseña</h1>

  <b2b-notification-inline
    [visible]="true"
    state="info"
    type="info"
    title="Requisitos de la contraseña"
    description="Mínimo 10 caracteres, al menos una mayúscula, una minúscula y un número, y no puede contener tu usuario."
    data-testid="password-policy"
  ></b2b-notification-inline>

  <b2b-notification-inline
    *ngIf="errorMessage"
    [visible]="true"
    state="error"
    type="error"
    [title]="errorMessage"
    [description]="errorDetail"
    data-testid="change-password-error"
  ></b2b-notification-inline>

  <form
    class="change-password-form"
    [formGroup]="changePasswordForm"
    (ngSubmit)="onSubmit()"
    data-testid="change-password-form"
  >
    <b2b-password-field
      class="b2b-width-full"
      formControlName="currentPassword"
      label="Contraseña actual"
      inputName="currentPassword"
    ></b2b-password-field>

    <b2b-password-field
      class="b2b-width-full"
      formControlName="newPassword"
      label="Contraseña nueva"
      inputName="newPassword"
    ></b2b-password-field>

    <b2b-notification-inline
      *ngIf="showPolicyError"
      [visible]="true"
      state="error"
      type="error"
      title="La nueva contraseña no cumple la política de seguridad"
      data-testid="policy-error"
    ></b2b-notification-inline>

    <b2b-notification-inline
      *ngIf="showSameAsCurrent"
      [visible]="true"
      state="error"
      type="error"
      title="La nueva contraseña debe ser distinta de la actual"
      data-testid="same-as-current-error"
    ></b2b-notification-inline>

    <b2b-password-field
      class="b2b-width-full"
      formControlName="confirmPassword"
      label="Confirmación de la contraseña nueva"
      inputName="confirmPassword"
    ></b2b-password-field>

    <b2b-notification-inline
      *ngIf="showMismatch"
      [visible]="true"
      state="error"
      type="error"
      title="Las contraseñas no coinciden"
      data-testid="mismatch-error"
    ></b2b-notification-inline>

    <div class="change-password-actions">
      <button
        b2b-button
        type="submit"
        data-testid="change-password-submit"
        [disabled]="submitting"
      >
        Guardar
      </button>
      <button
        b2b-button
        type="button"
        class="b2b--secondary"
        variant="secondary"
        data-testid="cancel-button"
        (click)="cancel()"
      >
        Cancelar
      </button>
    </div>
  </form>
</b2b-container>
