<b2b-container>
  <div b2b-container-body>
    <div class="tray-action">
      <h1 style="font-size: var(--b2b-titles-04-font-size)">Reasignación del técnico de mantenimiento</h1>

      <b2b-spinner *ngIf="loading()" description="Cargando incidencia"></b2b-spinner>

      <b2b-notification-inline
        *ngIf="loadError() as msg"
        [visible]="true"
        state="error"
        type="error"
        [title]="msg"
        data-testid="load-error"
      ></b2b-notification-inline>

      <ng-container *ngIf="incident() as inc">
        <div class="tray-action__data">
          <b2b-read-data>
            <span b2b-read-data-label>Código de referencia</span>
            <span b2b-read-data-value data-testid="summary-code">{{ inc.incidentCode || '—' }}</span>
          </b2b-read-data>
          <b2b-read-data>
            <span b2b-read-data-label>Técnico actual</span>
            <span b2b-read-data-value data-testid="summary-assignee">{{ assignee() }}</span>
          </b2b-read-data>
        </div>

        <b2b-notification-inline
          [visible]="true"
          state="info"
          type="info"
          [title]="hint"
          data-testid="technician-hint"
        ></b2b-notification-inline>

        <div class="tray-action__field">
          <label b2b-label for="reassign-technician">Identificador del técnico de mantenimiento destino</label>
          <input
            b2b-input
            class="b2b-width-full"
            id="reassign-technician"
            type="number"
            min="1"
            step="1"
            required
            [formControl]="technician"
            (blur)="onBlur()"
            data-testid="technician-input"
          />
          <span *ngIf="formError() as msg" class="tray-action__error" role="alert" data-testid="form-error">
            {{ msg }}
          </span>
        </div>
      </ng-container>

      <b2b-notification-inline
        *ngIf="submitError() as msg"
        [visible]="true"
        state="error"
        type="error"
        [title]="msg"
        data-testid="submit-error"
      ></b2b-notification-inline>

      <div class="tray-action__actions">
        <button b2b-button type="button" [disabled]="confirmDisabled()" data-testid="confirm" (click)="confirm()">
          Confirmar reasignación
        </button>
        <button
          b2b-button
          type="button"
          variant="secondary"
          class="b2b--secondary"
          data-testid="cancel"
          (click)="cancel()"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</b2b-container>
