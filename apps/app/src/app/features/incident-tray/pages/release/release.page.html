<b2b-container>
  <div b2b-container-body>
    <div class="tray-action">
      <h1 style="font-size: var(--b2b-titles-04-font-size)">Liberación de la incidencia</h1>

      <b2b-spinner *ngIf="loading()" description="Cargando incidencia"></b2b-spinner>

      <b2b-notification-inline
        *ngIf="loadError() as msg"
        [visible]="true"
        state="error"
        type="error"
        [title]="msg"
        data-testid="load-error"
      ></b2b-notification-inline>

      <ng-container *ngIf="incident() as inc">
        <section class="tray-action__section">
          <h2 style="font-size: var(--b2b-titles-05-font-size)">Incidencia a liberar</h2>
          <div class="tray-action__data">
            <b2b-read-data>
              <span b2b-read-data-label>Código de referencia</span>
              <span b2b-read-data-value data-testid="summary-code">{{ inc.incidentCode || '—' }}</span>
            </b2b-read-data>
            <b2b-read-data>
              <span b2b-read-data-label>Técnico asignado</span>
              <span b2b-read-data-value data-testid="summary-assignee">{{ assignee() }}</span>
            </b2b-read-data>
          </div>
        </section>

        <section class="tray-action__section">
          <h2 style="font-size: var(--b2b-titles-05-font-size)">Motivo de la liberación</h2>
          <div class="tray-action__field">
            <label b2b-label for="release-reason">Motivo</label>
            <textarea
              b2b-text-area
              class="b2b-width-full"
              id="release-reason"
              rows="5"
              required
              [attr.maxlength]="reasonMax"
              [formControl]="reason"
              (blur)="onBlur()"
              data-testid="reason-input"
            ></textarea>
            <span class="tray-action__counter" data-testid="reason-counter"
              >{{ reasonLength() }}/{{ reasonMax }}</span
            >
            <span *ngIf="formError() as msg" class="tray-action__error" role="alert" data-testid="form-error">
              {{ msg }}
            </span>
          </div>
        </section>
      </ng-container>

      <b2b-notification-inline
        *ngIf="submitError() as msg"
        [visible]="true"
        state="error"
        type="error"
        [title]="msg"
        data-testid="submit-error"
      ></b2b-notification-inline>

      <div class="tray-action__actions">
        <button b2b-button type="button" [disabled]="confirmDisabled()" data-testid="confirm" (click)="confirm()">
          Confirmar liberación
        </button>
        <button
          b2b-button
          type="button"
          variant="secondary"
          class="b2b--secondary"
          data-testid="cancel"
          (click)="cancel()"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</b2b-container>
