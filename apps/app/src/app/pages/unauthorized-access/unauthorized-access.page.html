
<div class="unauthorized-container">
  <b2b-notification-inline
    [visible]="true"
    type="error"
    title="Acceso no autorizado"
    message="No tienes permisos para acceder a esta página."
  ></b2b-notification-inline>

  <div class="details">
    <p><strong>Ruta solicitada:</strong> {{ requestedUrl }}</p>
    <p><strong>Tu rol actual:</strong> {{ userRole }}</p>
  </div>

  <button b2b-button (click)="onBack()">Volver a la página de inicio</button>
</div>
