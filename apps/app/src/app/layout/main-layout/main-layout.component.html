<b2b-header-desktop>
  <b2b-mapfre-logo b2b-header-logo></b2b-mapfre-logo>
  <div b2b-header-functions class="header-user">
    @if (user(); as u) {
      <span class="header-user-name" data-testid="header-user-name">{{ u.fullName }}</span>
      <b2b-tag data-testid="header-user-role">{{ u.roleLabel }}</b2b-tag>
    }
    <button
      b2b-button
      type="button"
      class="b2b--secondary"
      data-testid="logout-button"
      [disabled]="loggingOut()"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  </div>
</b2b-header-desktop>
@if (logoutError(); as msg) {
  <b2b-notification-inline
    [visible]="true"
    state="error"
    type="error"
    title="Cierre de sesión"
    [description]="msg"
    data-testid="logout-error"
  ></b2b-notification-inline>
}
<div class="shell-body">
  <app-nav-menu class="shell-nav"></app-nav-menu>
  <main class="shell-content">
    <b2b-container>
      <div b2b-container-body>
        <router-outlet></router-outlet>
      </div>
    </b2b-container>
  </main>
</div>
<b2b-footer></b2b-footer>
