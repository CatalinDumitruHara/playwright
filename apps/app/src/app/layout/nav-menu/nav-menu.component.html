<b2b-sidebar [expanded]="expanded()" (expandedChange)="expanded.set($event)">
  @for (item of mainItems(); track item.path) {
    <b2b-sidebar-item
      [title]="item.label"
      [selected]="isActive(item)"
      (clicked)="go(item)"
      [attr.data-testid]="'nav-' + item.path"
    ></b2b-sidebar-item>
  }
  @for (item of authItems(); track item.path) {
    <b2b-sidebar-item
      [title]="item.label"
      [selected]="isActive(item)"
      (clicked)="go(item)"
      [attr.data-testid]="'nav-' + item.path"
    ></b2b-sidebar-item>
  }
</b2b-sidebar>
