        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: &id004
      - ROL-001
      - ROL-002
      - ROL-003
      security:
      - bearerAuth: *id004
  /auth/initial-password:
    put:
      operationId: EP-006
      summary: Establece la contraseña definitiva en el primer acceso tras alta o
